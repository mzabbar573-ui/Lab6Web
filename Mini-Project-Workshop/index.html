<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Form Pendaftaran Workshop</h1>
      <p>Silakan isi formulir pendaftaran berikut.</p>

      <form id="formWorkshop" novalidate>
        <label for="namaWorkshop">Nama Lengkap</label>
        <input
          type="text"
          id="namaWorkshop"
          placeholder="Masukkan nama lengkap"
        />

        <p>Jumlah karakter: <span id="hitungKarakter">0</span></p>

        <label for="emailWorkshop">Email</label>
        <input type="email" id="emailWorkshop" placeholder="contoh@gmail.com" />

        <label for="sesiWorkshop">Pilih Sesi Workshop</label>
        <select id="sesiWorkshop">
          <option value="">-- Pilih Sesi --</option>
          <option value="Sesi Pagi (09.00 - 12.00)">
            Sesi Pagi (09.00 - 12.00)
          </option>
          <option value="Sesi Siang (13.00 - 16.00)">
            Sesi Siang (13.00 - 16.00)
          </option>
          <option value="Sesi Malam (19.00 - 21.00)">
            Sesi Malam (19.00 - 21.00)
          </option>
        </select>

        <p id="pilihanSesi">Sesi yang dipilih: Belum ada</p>

        <div class="tombol">
          <button type="submit">Daftar Workshop</button>
          <button type="reset" class="reset">Reset</button>
        </div>
      </form>

      <p id="pesanWorkshop"></p>
      <div id="ringkasanWorkshop"></div>
    </div>
  </body>
</html>
